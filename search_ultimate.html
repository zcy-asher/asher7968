<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球情报搜索 - 多领域自动翻译版</title>
<style>
  :root { 
    --bg: #0a0a0a; 
    --card: #151515; 
    --text: #f0f0f0; 
    --accent: #00d4ff; 
    --accent2: #7c3aed;
    --gray: #666; 
    --success: #10b981;
    --warning: #f59e0b;
    --ai: #00d4ff;
    --tech: #7c3aed;
    --startup: #f59e0b;
    --design: #ec4899;
    --marketing: #10b981;
    --crypto: #f7931a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%); 
    color: var(--text); 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    margin: 0; 
    padding: 0;
    min-height: 100vh;
  }
  
  .header {
    background: rgba(21, 21, 21, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #222;
    padding: 25px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { 
    font-size: 32px; 
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle { color: var(--gray); font-size: 14px; margin-bottom: 20px; }
  
  /* 领域选择 */
  .domains {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .domain-btn {
    padding: 10px 20px;
    border-radius: 8px;
    border: 2px solid #333;
    background: var(--card);
    color: var(--gray);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.3s;
  }
  .domain-btn:hover {
    border-color: var(--accent);
    color: var(--text);
  }
  .domain-btn.active {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000;
    border-color: transparent;
    font-weight: bold;
  }
  .domain-btn[data-domain="AI"] { --accent: var(--ai); }
  .domain-btn[data-domain="Technology"] { --accent: var(--tech); }
  .domain-btn[data-domain="Startup"] { --accent: var(--startup); }
  .domain-btn[data-domain="Design"] { --accent: var(--design); }
  .domain-btn[data-domain="Marketing"] { --accent: var(--marketing); }
  .domain-btn[data-domain="Crypto"] { --accent: var(--crypto); }
  
  .search-box { 
    display: flex; 
    gap: 10px; 
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .search-input-wrapper {
    flex: 1;
    min-width: 300px;
    position: relative;
  }
  input[type="text"] { 
    width: 100%;
    padding: 16px 20px; 
    border-radius: 12px; 
    border: 2px solid #333; 
    background: #0a0a0a; 
    color: #fff; 
    outline: none; 
    font-size: 16px;
    transition: all 0.3s;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
  }
  button.search-btn { 
    padding: 16px 32px; 
    border-radius: 12px; 
    border: none; 
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000; 
    font-weight: bold; 
    cursor: pointer; 
    font-size: 16px;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  button.search-btn:hover { 
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3);
  }
  button.search-btn:disabled { 
    background: #333; 
    cursor: not-allowed;
    transform: none;
  }
  
  .filters {
    display: flex;
    gap: 15px;
    margin-bottom: 25px;
    flex-wrap: wrap;
    align-items: center;
    padding: 15px;
    background: var(--card);
    border-radius: 12px;
    border: 1px solid #222;
  }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .filter-group label {
    font-size: 13px;
    color: var(--gray);
    white-space: nowrap;
  }
  select, input[type="number"] {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #0a0a0a;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  select:focus, input[type="number"]:focus {
    border-color: var(--accent);
  }
  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .checkbox-group input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: var(--accent);
  }
  
  .stats {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    font-size: 14px;
    color: var(--gray);
    flex-wrap: wrap;
  }
  .stat-item {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    padding: 8px 15px;
    border-radius: 8px;
    border: 1px solid #222;
  }
  .stat-value {
    color: var(--accent);
    font-weight: bold;
  }
  
  #results { 
    display: grid; 
    gap: 15px;
    margin-bottom: 40px;
  }
  .card { 
    background: var(--card); 
    padding: 22px; 
    border-radius: 12px; 
    cursor: pointer; 
    transition: all 0.3s;
    border: 1px solid #222;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, var(--accent), var(--accent2));
    opacity: 0;
    transition: opacity 0.3s;
  }
  .card:hover { 
    border-color: var(--accent);
    transform: translateX(5px);
    box-shadow: 0 5px 20px rgba(0, 212, 255, 0.1);
  }
  .card:hover::before {
    opacity: 1;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
    margin-bottom: 10px;
  }
  .card h3 { 
    margin: 0;
    font-size: 17px;
    line-height: 1.4;
    color: #fff;
    flex: 1;
  }
  .domain-badge {
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .domain-badge.ai { background: rgba(0, 212, 255, 0.2); color: var(--ai); }
  .domain-badge.tech { background: rgba(124, 58, 237, 0.2); color: var(--tech); }
  .domain-badge.startup { background: rgba(245, 158, 11, 0.2); color: var(--startup); }
  .domain-badge.design { background: rgba(236, 72, 153, 0.2); color: var(--design); }
  .domain-badge.marketing { background: rgba(16, 185, 129, 0.2); color: var(--marketing); }
  .domain-badge.crypto { background: rgba(247, 147, 26, 0.2); color: var(--crypto); }
  
  .card-preview {
    font-size: 14px;
    color: var(--gray);
    line-height: 1.6;
    margin-bottom: 12px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .meta { 
    display: flex; 
    gap: 20px; 
    font-size: 13px; 
    color: var(--gray);
    flex-wrap: wrap;
    align-items: center;
  }
  .meta-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .score { 
    color: var(--warning); 
    font-weight: bold;
    background: rgba(245, 158, 11, 0.1);
    padding: 2px 8px;
    border-radius: 4px;
  }
  .comments { color: var(--accent); }
  .source-tag {
    background: #222;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    color: var(--gray);
  }
  .translate-badge {
    background: var(--success);
    color: #000;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: bold;
  }
  
  #modal { 
    display: none; 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background: rgba(0,0,0,0.95); 
    z-index: 1000; 
    overflow-y: auto;
  }
  .modal-content { 
    background: #151515; 
    max-width: 900px; 
    margin: 40px auto;
    border-radius: 16px; 
    padding: 40px;
    border: 1px solid #222;
    position: relative;
  }
  .close { 
    position: fixed;
    top: 20px;
    right: 40px;
    font-size: 36px; 
    cursor: pointer; 
    color: var(--gray);
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.3s;
    z-index: 1001;
  }
  .close:hover {
    background: #333;
    color: #fff;
  }
  .modal-header {
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid #222;
  }
  .modal-title {
    font-size: 28px;
    line-height: 1.3;
    margin-bottom: 15px;
    color: #fff;
  }
  .modal-meta {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    font-size: 14px;
    color: var(--gray);
    align-items: center;
  }
  .translation-notice {
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid var(--success);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: var(--success);
  }
  .modal-body { 
    line-height: 1.8; 
    font-size: 16px; 
    color: #ddd;
  }
  .modal-body p {
    margin-bottom: 1.5em;
  }
  .modal-body a {
    color: var(--accent);
    text-decoration: none;
  }
  .modal-body a:hover {
    text-decoration: underline;
  }
  .content-section {
    margin-bottom: 30px;
  }
  .section-title {
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 1px solid #222;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .original-text {
    background: #0a0a0a;
    padding: 20px;
    border-radius: 8px;
    font-size: 14px;
    color: var(--gray);
    border-left: 3px solid var(--gray);
    margin-bottom: 20px;
  }
  .translated-text {
    background: rgba(0, 212, 255, 0.05);
    padding: 20px;
    border-radius: 8px;
    font-size: 15px;
    color: var(--text);
    border-left: 3px solid var(--accent);
  }
  .action-buttons {
    display: flex;
    gap: 10px;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid #222;
    flex-wrap: wrap;
  }
  .btn-secondary {
    background: #222;
    color: #fff;
    padding: 12px 24px;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .btn-secondary:hover {
    background: #333;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000;
    padding: 12px 24px;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    text-decoration: none;
    display: inline-block;
  }
  
  .loading { 
    text-align: center; 
    padding: 60px 20px;
    color: var(--accent);
    display: none;
  }
  .spinner {
    width: 60px;
    height: 60px;
    border: 4px solid #222;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loading-text {
    font-size: 16px;
    margin-bottom: 10px;
  }
  .loading-subtext {
    font-size: 13px;
    color: var(--gray);
  }
  
  .highlight {
    background: rgba(0, 212, 255, 0.3);
    padding: 2px 4px;
    border-radius: 3px;
    color: #fff;
  }
  
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--gray);
  }
  .empty-icon {
    font-size: 80px;
    margin-bottom: 20px;
    opacity: 0.5;
  }
  
  @media (max-width: 768px) {
    .modal-content {
      margin: 0;
      border-radius: 0;
      padding: 20px;
    }
    .filters {
      flex-direction: column;
      align-items: stretch;
    }
    .filter-group {
      justify-content: space-between;
    }
  }
</style>
</head>
<body>

<div class="header">
  <div class="container">
    <h1>🌍 全球情报搜索</h1>
    <div class="subtitle">多领域 · 自动翻译 · 实时情报</div>
    
    <div class="domains">
      <button class="domain-btn active" data-domain="All" onclick="selectDomain('All')">🌐 全部领域</button>
      <button class="domain-btn" data-domain="AI" onclick="selectDomain('AI')">🤖 AI/机器学习</button>
      <button class="domain-btn" data-domain="Technology" onclick="selectDomain('Technology')">💻 技术开发</button>
      <button class="domain-btn" data-domain="Startup" onclick="selectDomain('Startup')">🚀 创业/产品</button>
      <button class="domain-btn" data-domain="Design" onclick="selectDomain('Design')">🎨 设计/UX</button>
      <button class="domain-btn" data-domain="Marketing" onclick="selectDomain('Marketing')">📈 营销/增长</button>
      <button class="domain-btn" data-domain="Crypto" onclick="selectDomain('Crypto')">₿ 区块链/Web3</button>
    </div>
    
    <div class="search-box">
      <div class="search-input-wrapper">
        <input type="text" id="keyword" placeholder="输入关键词 (如: ChatGPT, Docker, SaaS, No-code...)">
      </div>
      <button class="search-btn" id="btn" onclick="search()">🔍 搜索并翻译</button>
    </div>
    
    <div class="filters">
      <div class="filter-group">
        <label>数据源:</label>
        <select id="dataSource">
          <option value="all">全部源</option>
          <option value="hackernews">Hacker News</option>
          <option value="reddit">Reddit</option>
          <option value="github">GitHub</option>
        </select>
      </div>
      <div class="filter-group">
        <label>排序:</label>
        <select id="sortBy">
          <option value="popularity">🔥 热度</option>
          <option value="date">🕐 时间</option>
          <option value="comments">💬 评论</option>
        </select>
      </div>
      <div class="filter-group">
        <label>最低热度:</label>
        <input type="number" id="minScore" value="5" min="0" step="5" style="width: 80px;">
      </div>
      <div class="filter-group checkbox-group">
        <input type="checkbox" id="autoTranslate" checked>
        <label for="autoTranslate" style="cursor: pointer; margin: 0;">自动翻译中文</label>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <div class="stats" id="stats" style="display: none;">
    <div class="stat-item">
      <span>找到</span>
      <span class="stat-value" id="resultCount">0</span>
      <span>条</span>
    </div>
    <div class="stat-item">
      <span>平均热度:</span>
      <span class="stat-value" id="avgScore">0</span>
    </div>
    <div class="stat-item">
      <span>最高热度:</span>
      <span class="stat-value" id="maxScore">0</span>
    </div>
    <div class="stat-item">
      <span>领域:</span>
      <span class="stat-value" id="currentDomain">全部</span>
    </div>
  </div>
  
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div class="loading-text">正在搜索全球情报...</div>
    <div class="loading-subtext">正在提取内容并翻译成中文</div>
  </div>
  
  <div id="results"></div>
</div>

<div id="modal" onclick="if(event.target===this)closeModal()">
  <div class="close" onclick="closeModal()">&times;</div>
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title" id="m-title"></h2>
      <div class="modal-meta">
        <span id="m-author"></span>
        <span>•</span>
        <span id="m-date"></span>
        <span>•</span>
        <span class="score" id="m-score"></span>
        <span>•</span>
        <span id="m-source"></span>
        <span>•</span>
        <span id="m-domain"></span>
      </div>
      <div style="margin-top: 10px; font-size: 13px; color: #666; word-break: break-all;" id="m-url"></div>
    </div>
    
    <div class="translation-notice">
      <span>🌐</span>
      <span>以下内容已自动翻译成中文（点击可切换原文）</span>
    </div>
    
    <div class="content-section">
      <div class="section-title">
        <span>📄</span>
        <span>内容摘要（中文翻译）</span>
      </div>
      <div id="m-body" class="translated-text"></div>
    </div>
    
    <div class="content-section" id="originalSection" style="display: none;">
      <div class="section-title">
        <span>📝</span>
        <span>原文（English）</span>
      </div>
      <div id="m-original" class="original-text"></div>
    </div>
    
    <div class="action-buttons">
      <a id="m-link" href="#" target="_blank" style="text-decoration: none;">
        <button class="btn-primary">🔗 访问原文</button>
      </a>
      <button class="btn-secondary" onclick="toggleLanguage()">🌐 切换语言</button>
      <button class="btn-secondary" onclick="copyContent()">📋 复制全文</button>
      <button class="btn-secondary" onclick="exportMarkdown()">📥 导出Markdown</button>
    </div>
  </div>
</div>

<script>
  // 领域关键词映射
  const DOMAIN_KEYWORDS = {
    'AI': ['AI', 'artificial intelligence', 'machine learning', 'LLM', 'GPT', 'neural network', 'deep learning', 'ChatGPT', 'transformer'],
    'Technology': ['software', 'programming', 'coding', 'developer', 'API', 'cloud', 'devops', 'database', 'framework'],
    'Startup': ['startup', 'product', 'founder', 'venture capital', 'funding', 'SaaS', 'MVP', 'growth'],
    'Design': ['design', 'UX', 'UI', 'user experience', 'interface', 'Figma', 'prototype', 'visual'],
    'Marketing': ['marketing', 'SEO', 'content', 'social media', 'growth hacking', 'conversion', 'analytics'],
    'Crypto': ['blockchain', 'crypto', 'bitcoin', 'ethereum', 'Web3', 'NFT', 'DeFi', 'smart contract']
  };

  let currentData = null;
  let currentItem = null;
  let currentDomain = 'All';
  let showOriginal = false;

  function selectDomain(domain) {
    currentDomain = domain;
    document.querySelectorAll('.domain-btn').forEach(btn => {
      btn.classList.remove('active');
      if (btn.dataset.domain === domain) {
        btn.classList.add('active');
      }
    });
    document.getElementById('currentDomain').textContent = domain === 'All' ? '全部' : domain;
  }

  function detectDomain(title, text = '') {
    const combined = (title + ' ' + text).toLowerCase();
    for (const [domain, keywords] of Object.entries(DOMAIN_KEYWORDS)) {
      if (keywords.some(kw => combined.includes(kw.toLowerCase()))) {
        return domain;
      }
    }
    return 'Technology';
  }

  function getDomainClass(domain) {
    const map = {
      'AI': 'ai',
      'Technology': 'tech',
      'Startup': 'startup',
      'Design': 'design',
      'Marketing': 'marketing',
      'Crypto': 'crypto'
    };
    return map[domain] || 'tech';
  }

  async function search() {
    const keyword = document.getElementById('keyword').value.trim();
    if (!keyword) {
      alert("请输入关键词");
      return;
    }

    document.getElementById('loading').style.display = 'block';
    document.getElementById('results').innerHTML = '';
    document.getElementById('btn').disabled = true;
    document.getElementById('stats').style.display = 'none';

    try {
      const source = document.getElementById('dataSource').value;
      const minScore = parseInt(document.getElementById('minScore').value) || 0;
      const sortBy = document.getElementById('sortBy').value;
      
      let allHits = [];
      
      // 根据数据源获取数据
      if (source === 'all' || source === 'hackernews') {
        const hnHits = await searchHackerNews(keyword);
        allHits = allHits.concat(hnHits);
      }
      if (source === 'all' || source === 'reddit') {
        const redditHits = await searchReddit(keyword);
        allHits = allHits.concat(redditHits);
      }
      if (source === 'all' || source === 'github') {
        const githubHits = await searchGitHub(keyword);
        allHits = allHits.concat(githubHits);
      }
      
      // 筛选和分类
      let filteredHits = allHits.filter(item => {
        if (item.points < minScore) return false;
        if (currentDomain !== 'All') {
          const itemDomain = detectDomain(item.title, item.text || '');
          if (itemDomain !== currentDomain) return false;
        }
        return true;
      });
      
      // 排序
      filteredHits.sort((a, b) => {
        if (sortBy === 'popularity') return b.points - a.points;
        if (sortBy === 'date') return new Date(b.created_at) - new Date(a.created_at);
        if (sortBy === 'comments') return (b.num_comments || 0) - (a.num_comments || 0);
        return 0;
      });
      
      currentData = filteredHits;
      updateStats(filteredHits);
      renderResults(filteredHits, keyword);
      
    } catch (e) {
      console.error(e);
      alert("搜索失败，请检查网络连接");
    } finally {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('btn').disabled = false;
    }
  }

  async function searchHackerNews(keyword) {
    try {
      const url = `https://hn.algolia.com/api/v1/search?query=${encodeURIComponent(keyword)}&tags=story&hitsPerPage=30`;
      const response = await fetch(url);
      const data = await response.json();
      return data.hits.map(item => ({
        ...item,
        source: 'Hacker News',
        domain: detectDomain(item.title),
        text: item.title
      }));
    } catch (e) {
      console.error('Hacker News search failed:', e);
      return [];
    }
  }

  async function searchReddit(keyword) {
    try {
      const url = `https://www.reddit.com/search.json?q=${encodeURIComponent(keyword)}&limit=20`;
      const response = await fetch(url, {
        headers: { 'User-Agent': 'Mozilla/5.0' }
      });
      const data = await response.json();
      return data.data.children.map(item => ({
        title: item.data.title,
        url: item.data.url,
        author: item.data.author,
        score: item.data.score || 0,
        points: item.data.score || 0,
        num_comments: item.data.num_comments || 0,
        created_at: new Date(item.data.created_utc * 1000).toISOString(),
        source: 'Reddit',
        domain: detectDomain(item.data.title, item.data.selftext),
        text: item.data.selftext,
        objectID: item.data.id
      }));
    } catch (e) {
      console.error('Reddit search failed:', e);
      return [];
    }
  }

  async function searchGitHub(keyword) {
    try {
      const url = `https://api.github.com/search/repositories?q=${encodeURIComponent(keyword)}&sort=stars&order=desc&per_page=20`;
      const response = await fetch(url);
      const data = await response.json();
      return data.items.map(item => ({
        title: item.name,
        url: item.html_url,
        author: item.owner.login,
        score: item.stargazers_count,
        points: item.stargazers_count,
        num_comments: 0,
        created_at: item.created_at,
        source: 'GitHub',
        domain: detectDomain(item.name, item.description || ''),
        text: item.description || '',
        objectID: item.id,
        description: item.description
      }));
    } catch (e) {
      console.error('GitHub search failed:', e);
      return [];
    }
  }

  function updateStats(hits) {
    document.getElementById('stats').style.display = 'flex';
    document.getElementById('resultCount').textContent = hits.length;
    
    if (hits.length > 0) {
      const avgScore = Math.round(hits.reduce((sum, item) => sum + item.points, 0) / hits.length);
      const maxScore = Math.max(...hits.map(item => item.points));
      document.getElementById('avgScore').textContent = avgScore;
      document.getElementById('maxScore').textContent = maxScore;
    }
  }

  function renderResults(hits, keyword) {
    const list = document.getElementById('results');
    
    if (hits.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🔍</div>
          <h3>未找到相关情报</h3>
          <p>尝试调整筛选条件或使用其他关键词</p>
        </div>
      `;
      return;
    }
    
    hits.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'card';
      
      const domain = item.domain || detectDomain(item.title);
      const domainClass = getDomainClass(domain);
      const date = new Date(item.created_at);
      const hoursAgo = Math.floor((new Date() - date) / (1000 * 60 * 60));
      const timeStr = hoursAgo < 24 ? `${hoursAgo}小时前` : date.toLocaleDateString();
      
      div.innerHTML = `
        <div class="card-header">
          <h3>${highlightKeyword(item.title, keyword)}</h3>
          <span class="domain-badge ${domainClass}">${domain}</span>
        </div>
        <div class="card-preview">${item.description || item.text || item.title}</div>
        <div class="meta">
          <span class="meta-item score">▲ ${item.points}</span>
          <span class="meta-item comments">💬 ${item.num_comments || 0}</span>
          <span class="meta-item">👤 ${item.author || 'unknown'}</span>
          <span class="meta-item">🕐 ${timeStr}</span>
          <span class="source-tag">${item.source}</span>
          <span class="translate-badge">🌐 可翻译</span>
        </div>
      `;
      
      div.onclick = () => openModal(item, keyword);
      list.appendChild(div);
    });
  }

  function highlightKeyword(text, keyword) {
    if (!text) return '';
    const regex = new RegExp(`(${keyword})`, 'gi');
    return text.replace(regex, '<span class="highlight">$1</span>');
  }

  async function openModal(item, keyword) {
    currentItem = item;
    showOriginal = false;
    
    const domain = item.domain || detectDomain(item.title);
    document.getElementById('m-title').innerHTML = highlightKeyword(item.title, keyword);
    document.getElementById('m-author').textContent = `👤 ${item.author || 'unknown'}`;
    document.getElementById('m-date').textContent = `🕐 ${new Date(item.created_at).toLocaleString()}`;
    document.getElementById('m-score').textContent = `▲ ${item.points} 热度`;
    document.getElementById('m-source').textContent = item.source;
    document.getElementById('m-domain').textContent = domain;
    document.getElementById('m-url').textContent = item.url || `https://news.ycombinator.com/item?id=${item.objectID}`;
    document.getElementById('m-link').href = item.url || `https://news.ycombinator.com/item?id=${item.objectID}`;
    
    // 提取和翻译内容
    document.getElementById('m-body').innerHTML = '<div style="text-align: center; padding: 40px;"><div class="spinner" style="width: 40px; height: 40px; margin: 0 auto 20px;"></div>正在提取并翻译内容...</div>';
    document.getElementById('originalSection').style.display = 'none';
    
    const content = await extractAndTranslateContent(item);
    
    if (content.translated) {
      document.getElementById('m-body').innerHTML = formatText(content.translated);
      document.getElementById('m-original').innerHTML = formatText(content.original);
      document.getElementById('originalSection').style.display = 'block';
    } else {
      document.getElementById('m-body').innerHTML = '<p style="color: #666;">无法提取内容，请点击"访问原文"查看</p>';
      document.getElementById('originalSection').style.display = 'none';
    }
    
    document.getElementById('modal').style.display = 'block';
    document.body.style.overflow = 'hidden';
  }

  async function extractAndTranslateContent(item) {
    const autoTranslate = document.getElementById('autoTranslate').checked;
    
    try {
      let originalText = item.text || item.description || '';
      
      // 如果有URL，尝试提取网页内容
      if (item.url && !originalText) {
        const extractorUrl = `https://r.jina.ai/${item.url}`;
        const response = await fetch(extractorUrl);
        const text = await response.text();
        originalText = text;
      }
      
      if (!originalText || originalText.length < 10) {
        return { original: item.title, translated: null };
      }
      
      // 翻译
      let translatedText = null;
      if (autoTranslate) {
        translatedText = await translateText(originalText);
      }
      
      return {
        original: originalText,
        translated: translatedText
      };
    } catch (e) {
      console.error('Content extraction failed:', e);
      return { original: item.title, translated: null };
    }
  }

  async function translateText(text) {
    try {
      // 使用MyMemory Translation API（免费）
      const truncatedText = text.substring(0, 500); // 限制长度
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(truncatedText)}&langpair=en|zh`;
      const response = await fetch(url);
      const data = await response.json();
      
      if (data.responseStatus === 200 && data.responseData) {
        return data.responseData.translatedText;
      }
      
      // 如果翻译失败，返回原文
      return null;
    } catch (e) {
      console.error('Translation failed:', e);
      return null;
    }
  }

  function formatText(text) {
    if (!text) return '';
    return text
      .split('\n\n')
      .filter(para => para.trim().length > 0)
      .map(para => `<p>${para.trim()}</p>`)
      .join('');
  }

  function toggleLanguage() {
    showOriginal = !showOriginal;
    const translatedEl = document.getElementById('m-body');
    const originalEl = document.getElementById('m-original');
    
    if (showOriginal && originalEl.innerHTML) {
      translatedEl.className = 'original-text';
      translatedEl.innerHTML = originalEl.innerHTML;
    } else if (currentItem) {
      translatedEl.className = 'translated-text';
      translatedEl.innerHTML = formatText(currentItem.translatedText || currentItem.text || currentItem.title);
    }
  }

  function closeModal() {
    document.getElementById('modal').style.display = 'none';
    document.body.style.overflow = 'auto';
  }

  function copyContent() {
    if (!currentItem) return;
    
    const title = currentItem.title;
    const author = currentItem.author || 'unknown';
    const date = new Date(currentItem.created_at).toLocaleString();
    const url = currentItem.url || '';
    const source = currentItem.source;
    const content = document.getElementById('m-body').innerText;
    
    const fullText = `${title}\n\n作者: ${author}\n来源: ${source}\n时间: ${date}\n链接: ${url}\n\n${content}`;
    
    navigator.clipboard.writeText(fullText).then(() => {
      alert('✅ 已复制到剪贴板');
    });
  }

  function exportMarkdown() {
    if (!currentItem) return;
    
    const title = currentItem.title;
    const author = currentItem.author || 'unknown';
    const date = new Date(currentItem.created_at).toLocaleString();
    const url = currentItem.url || '';
    const source = currentItem.source;
    const content = document.getElementById('m-body').innerText;
    
    const markdown = `# ${title}\n\n**作者:** ${author}  \n**来源:** ${source}  \n**时间:** ${date}  \n**链接:** ${url}\n\n---\n\n${content}\n\n---\n\n> 导出时间: ${new Date().toLocaleString()}`;
    
    const blob = new Blob([markdown], { type: 'text/markdown' });
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = `${title.replace(/[^a-z0-9]/gi, '_').substring(0, 50)}.md`;
    a.click();
    URL.revokeObjectURL(blobUrl);
  }

  document.getElementById('keyword').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') search();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
</script>
